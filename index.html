<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B2U Plus" />
    <meta name="theme-color" content="#020617" />
    <title>B2U Plus Flow | Premium ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <script>
      if (typeof process === 'undefined') { window.process = { env: {} }; }
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Tajawal", "sans-serif"] },
            colors: {
              primary: "#3b82f6",
              charcoal: { 950: "#020617", 900: "#0f172a", 800: "#1e293b", 700: "#334155", 600: "#475569" }
            },
            animation: {
              "fade-in": "fadeIn 0.4s ease-out",
              "slide-up": "slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)",
              "slide-in-right": "slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1)",
            },
            keyframes: {
              fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } },
              slideUp: { "0%": { transform: "translateY(20px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
              slideInRight: { "0%": { transform: "translateX(100%)" }, "100%": { transform: "translateX(0)" } },
            }
          },
        },
      };
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background-color: #020617; color: #f8fafc; overflow: hidden; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; } 
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>

}
