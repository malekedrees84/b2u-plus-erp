name: Auto Release (Tauri)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # مهم: لازم تكون سكربتات tauri:build موجودة في package.json
      # "tauri:build": "tauri build"
      - name: Build frontend
        run: npm run build

      - name: Tauri build + create GitHub Release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # مهم: لازم يكون عندك version صحيح داخل src-tauri/tauri.conf.json
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "Auto release v
