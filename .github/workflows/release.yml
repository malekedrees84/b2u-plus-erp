name: Auto Release (Tauri) + Sync from b2uprog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout b2u-plus-erp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout b2uprog (source UI)
        uses: actions/checkout@v4
        with:
          repository: malekedrees84/b2uprog
          ref: main
          path: _b2uprog
          token: ${{ secrets.B2UPROG_TOKEN }}

      - name: Sync UI from b2uprog into b2u-plus-erp
        shell: bash
        run: |
          set -e

          # remove old UI
          rm -rf ./components ./services ./backend ./icons ./dist ./node_modules || true
          rm -f ./App.tsx ./index.tsx ./index.html ./vite.config.ts ./tsconfig.json ./constants.ts ./types.ts ./package.json ./package-lock.json ./README.md ./metadata.json || true

          # copy new UI
          cp -R ./_b2uprog/components ./components
          cp -R ./_b2uprog/services ./services || true
          cp -R ./_b2uprog/backend ./backend || true
          cp -R ./_b2uprog/icons ./icons || true
          cp -R ./_b2uprog/dist ./dist || true

          cp -f ./_b2uprog/App.tsx ./App.tsx || true
          cp -f ./_b2uprog/index.tsx ./index.tsx || true
          cp -f ./_b2uprog/index.html ./index.html || true
          cp -f ./_b2uprog/vite.config.ts ./vite.config.ts || true
          cp -f ./_b2uprog/tsconfig.json ./tsconfig.json || true
          cp -f ./_b2uprog/constants.ts ./constants.ts || true
          cp -f ./_b2uprog/types.ts ./types.ts || true
          cp -f ./_b2uprog/package.json ./package.json || true
          cp -f ./_b2uprog/package-lock.json ./package-lock.json || true
          cp -f ./_b2uprog/README.md ./README.md || true
          cp -f ./_b2uprog/metadata.json ./metadata.json || true

          # IMPORTANT: don't commit embedded git repo
          rm -rf ./_b2uprog/.git || true

          echo "✅ Sync done"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli

      - name: Bump version (patch) in tauri.conf.json
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const p = "src-tauri/tauri.conf.json";
          const j = JSON.parse(fs.readFileSync(p,"utf8"));
          const parts = (j.version || "0.1.0").split(".").map(n => parseInt(n,10));
          parts[2] = (parts[2] || 0) + 1;
          j.version = parts.join(".");
          fs.writeFileSync(p, JSON.stringify(j, null, 2));
          console.log("NEW_VERSION:", j.version);
          NODE

      - name: Read version
        id: ver
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));
          process.stdout.write("version=" + j.version);
          NODE

      - name: Build Tauri (release)
        run: npx tauri build

      # ✅ SIGN DMG using secrets (fix base64/newline errors)
      - name: Sign DMG
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e

          DMG="$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)"
          echo "DMG=$DMG"

          # write key to file safely (no newline issues)
          echo "$TAURI_SIGNING_PRIVATE_KEY_B64" | tr -d '\n\r ' | base64 --decode > signing.key

          # sign
          npx tauri signer sign "$DMG" --private-key-path signing.key --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

          ls -la src-tauri/target/release/bundle/dmg || true

      # ✅ CREATE latest.json automatically (optional but helpful)
      - name: Generate latest.json
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.ver.outputs.version }}"
          DMG_FILE="$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | xargs -n1 basename | head -n1)"
          SIG_FILE="${DMG_FILE}.sig"

          SIG_CONTENT="$(cat "src-tauri/target/release/bundle/dmg/${SIG_FILE}")"
          SIZE_BYTES="$(stat -f%z "src-tauri/target/release/bundle/dmg/${DMG_FILE}")"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_FILE}",
                "signature": "${SIG_CONTENT}",
                "size": ${SIZE_BYTES}
              }
            }
          }
          EOF

          cat latest.json

      # ✅ COMMIT ONLY latest.json (no pushing main changes from workflow)
      - name: Commit latest.json (local only)
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json || true
          git commit -m "chore: update latest.json for v${{ steps.ver.outputs.version }}" || true

      # ✅ TAG ONLY (avoid non-fast-forward on main)
      - name: Create tag
        shell: bash
        run: |
          git tag -f "v${{ steps.ver.outputs.version }}"

      # ✅ PUSH TAG ONLY
      - name: Push tag
        shell: bash
        run: |
          git push -f origin "v${{ steps.ver.outputs.version }}"

      # ✅ Upload Release assets (overwrite enabled)
      - name: Upload Release (GH Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
