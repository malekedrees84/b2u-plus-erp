name: Auto Release (Tauri) + Sync from b2uprog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout b2u-plus-erp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout b2uprog (source UI)
        uses: actions/checkout@v4
        with:
          repository: malekedrees84/b2uprog
          ref: main
          path: _b2uprog
          token: ${{ secrets.B2UPROG_TOKEN }}

      # ✅ Sync UI (بدون ما نضيف _b2uprog للـ git)
      - name: Sync UI from b2uprog into b2u-plus-erp
        shell: bash
        run: |
          set -e

          # امسح UI القديم
          rm -rf ./components ./services ./backend ./icons ./dist ./node_modules || true
          rm -f ./App.tsx ./index.tsx ./index.html ./vite.config.ts ./tsconfig.json ./constants.ts ./types.ts ./package.json ./package-lock.json ./README.md ./metadata.json || true

          # انسخ UI الجديد
          cp -R ./_b2uprog/components ./components
          cp -R ./_b2uprog/services ./services || true
          cp -R ./_b2uprog/backend ./backend || true
          cp -R ./_b2uprog/icons ./icons || true

          cp -f ./_b2uprog/App.tsx ./App.tsx || true
          cp -f ./_b2uprog/index.tsx ./index.tsx || true
          cp -f ./_b2uprog/index.html ./index.html || true
          cp -f ./_b2uprog/vite.config.ts ./vite.config.ts || true
          cp -f ./_b2uprog/tsconfig.json ./tsconfig.json || true
          cp -f ./_b2uprog/constants.ts ./constants.ts || true
          cp -f ./_b2uprog/types.ts ./types.ts || true
          cp -f ./_b2uprog/package.json ./package.json || true
          cp -f ./_b2uprog/package-lock.json ./package-lock.json || true
          cp -f ./_b2uprog/README.md ./README.md || true
          cp -f ./_b2uprog/metadata.json ./metadata.json || true

          # مهم: لا تخلّي _b2uprog ينضاف للـ git
          rm -rf ./_b2uprog

          echo "✅ Sync done"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 🔥 bump version (patch) داخل tauri.conf.json فقط في ال runner (بدون commit)
      - name: Bump version (patch)
        id: bump
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const j = JSON.parse(fs.readFileSync(path,"utf8"));
          const v = (j.version || "0.1.0").split(".").map(n=>parseInt(n,10));
          v[2] = (v[2]||0)+1;
          j.version = v.join(".");
          fs.writeFileSync(path, JSON.stringify(j,null,2));
          console.log("version="+j.version);
          NODE | tee -a "$GITHUB_OUTPUT"

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (release)
        run: npx tauri build

      # ✅ لاقي dmg
      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG_PATH=$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          echo "dmg=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG_PATH=$DMG_PATH"

      # ✅ توقيع dmg باستخدام secrets (بدون export غلط)
      - name: Sign DMG
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign "${{ steps.dmg.outputs.dmg }}" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      # ✅ توليد latest.json كـ asset للـ release
      - name: Generate latest.json
        id: latest
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v${VERSION}"

          DMG_FILE=$(basename "${{ steps.dmg.outputs.dmg }}")
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG_FILE}"

          SIG_PATH="${{ steps.dmg.outputs.dmg }}.sig"
          SIG_CONTENT=$(cat "$SIG_PATH")

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "url": "${DMG_URL}",
                "signature": ${SIG_CONTENT@Q},
                "size": $(stat -f%z "${{ steps.dmg.outputs.dmg }}")
              }
            }
          }
          EOF

          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      # ✅ Create Tag (بدون push main)
      - name: Create and push tag only
        shell: bash
        run: |
          git tag "${{ steps.latest.outputs.TAG }}"
          git push origin "${{ steps.latest.outputs.TAG }}"

      # ✅ Release + upload فقط الملفات المهمة
      - name: Upload Release (GH Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest.outputs.TAG }}
          name: ${{ steps.latest.outputs.TAG }}
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
