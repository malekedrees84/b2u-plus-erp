name: Auto Release (Tauri) + Sync from b2uprog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      # ===============================
      # 1) Checkout b2u-plus-erp
      # ===============================
      - name: Checkout b2u-plus-erp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================
      # 2) Checkout b2uprog (Google AI Studio source)
      # ===============================
      - name: Checkout b2uprog (source UI)
        uses: actions/checkout@v4
        with:
          repository: malekedrees84/b2uprog
          ref: main
          path: _b2uprog
          token: ${{ secrets.B2UPROG_TOKEN }}

      # ===============================
      # 3) Sync UI files
      # ===============================
      - name: Sync UI from b2uprog
        shell: bash
        run: |
          set -e

          rm -rf components services backend icons dist node_modules || true
          rm -f App.tsx index.tsx index.html vite.config.ts tsconfig.json constants.ts types.ts package.json package-lock.json README.md metadata.json || true

          cp -R _b2uprog/components ./components
          cp -R _b2uprog/services ./services || true
          cp -R _b2uprog/backend ./backend || true
          cp -R _b2uprog/icons ./icons || true
          cp -R _b2uprog/dist ./dist || true

          cp -f _b2uprog/App.tsx ./App.tsx || true
          cp -f _b2uprog/index.tsx ./index.tsx || true
          cp -f _b2uprog/index.html ./index.html || true
          cp -f _b2uprog/vite.config.ts ./vite.config.ts || true
          cp -f _b2uprog/tsconfig.json ./tsconfig.json || true
          cp -f _b2uprog/constants.ts ./constants.ts || true
          cp -f _b2uprog/types.ts ./types.ts || true
          cp -f _b2uprog/package.json ./package.json || true
          cp -f _b2uprog/package-lock.json ./package-lock.json || true
          cp -f _b2uprog/README.md ./README.md || true
          cp -f _b2uprog/metadata.json ./metadata.json || true

          echo "✅ UI synced from b2uprog"

      # ===============================
      # 4) Setup Node
      # ===============================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===============================
      # 5) Install dependencies
      # ===============================
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ===============================
      # 6) Setup Rust
      # ===============================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ===============================
      # 7) Install Tauri CLI
      # ===============================
      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli

      # ===============================
      # 8) Bump version (patch)
      # ===============================
      - name: Bump version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "src-tauri/tauri.conf.json";
          const j = JSON.parse(fs.readFileSync(file, "utf8"));
          const v = (j.version || "0.1.0").split(".").map(n => parseInt(n, 10));
          v[2] = (v[2] || 0) + 1;
          j.version = v.join(".");
          fs.writeFileSync(file, JSON.stringify(j, null, 2));
          console.log("NEW_VERSION", j.version);
          NODE

      # ===============================
      # 9) Read version
      # ===============================
      - name: Get version
        id: ver
        shell: bash
        run: |
          node <<'NODE' >> $GITHUB_OUTPUT
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          console.log("version=" + j.version);
          NODE

      # ===============================
      # 10) Build Tauri
      # ===============================
      - name: Build Tauri
        run: npx tauri build

      # ===============================
      # 11) Sign DMG (CORRECT WAY)
      # ===============================
      - name: Sign DMG
        shell: bash
        run: |
          set -e

          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          echo "Signing $DMG"

          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > /tmp/tauri.key

          npx tauri signer sign "$DMG" \
            --private-key-path /tmp/tauri.key \
            --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"

      # ===============================
      # 12) Commit + Tag + Push
      # ===============================
      - name: Commit + Tag + Push
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "chore: release v${{ steps.ver.outputs.version }}" || true

          git tag -f "v${{ steps.ver.outputs.version }}"
          git push origin main
          git push -f origin "v${{ steps.ver.outputs.version }}"

      # ===============================
      # 13) Upload GitHub Release
      # ===============================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
