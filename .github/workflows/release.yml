name: Auto Release (Tauri) + Sync from b2uprog (Signed)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout b2u-plus-erp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout b2uprog (source UI)
        uses: actions/checkout@v4
        with:
          repository: malekedrees84/b2uprog
          ref: main
          path: _b2uprog
          token: ${{ secrets.B2UPROG_TOKEN }}

      - name: Sync UI from b2uprog into b2u-plus-erp
        shell: bash
        run: |
          set -e

          # remove old UI files (keep src-tauri)
          rm -rf ./components ./services ./backend ./icons ./dist ./node_modules || true
          rm -f ./App.tsx ./index.tsx ./index.html ./vite.config.ts ./tsconfig.json ./constants.ts ./types.ts ./README.md ./metadata.json || true

          # copy from b2uprog
          cp -R ./_b2uprog/components ./components
          cp -R ./_b2uprog/services ./services || true
          cp -R ./_b2uprog/backend ./backend || true
          cp -R ./_b2uprog/icons ./icons || true

          cp -f ./_b2uprog/App.tsx ./App.tsx || true
          cp -f ./_b2uprog/index.tsx ./index.tsx || true
          cp -f ./_b2uprog/index.html ./index.html || true
          cp -f ./_b2uprog/vite.config.ts ./vite.config.ts || true
          cp -f ./_b2uprog/tsconfig.json ./tsconfig.json || true
          cp -f ./_b2uprog/constants.ts ./constants.ts || true
          cp -f ./_b2uprog/types.ts ./types.ts || true
          cp -f ./_b2uprog/README.md ./README.md || true
          cp -f ./_b2uprog/metadata.json ./metadata.json || true

          # IMPORTANT: do NOT copy _b2uprog itself into git index
          rm -rf ./_b2uprog/.git || true

          echo "✅ Sync done"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (ci if lock exists)
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli

      - name: Bump version (patch) in tauri.conf.json
        shell: bash
        run: |
          set -e
          node - <<'NODE'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const j = JSON.parse(fs.readFileSync(path,"utf8"));
          const v = (j.version || "0.1.0").split(".").map(n=>parseInt(n,10));
          v[2] = (v[2]||0) + 1;
          j.version = v.join(".");
          fs.writeFileSync(path, JSON.stringify(j, null, 2));
          console.log("NEW_VERSION:", j.version);
          NODE

      - name: Read version
        id: ver
        shell: bash
        run: |
          set -e
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));
          console.log("version="+j.version);
          NODE

      - name: Build Tauri (release)
        shell: bash
        run: |
          set -e
          npx tauri build

      # =========================
      # ✅ SIGNING (RADICAL FIX)
      # =========================
      - name: Write signing key file
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -e
          # Write exactly as-is (no newlines)
          printf "%s" "$TAURI_SIGNING_PRIVATE_KEY" > signing.key
          echo "KEY_BYTES=$(wc -c < signing.key)"

      - name: Sign DMG
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          DMG="$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)"
          echo "Signing: $DMG"
          npx tauri signer sign "$DMG" --private-key-path signing.key --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Bundle dmg folder:"
          ls -la src-tauri/target/release/bundle/dmg/

      # =========================
      # latest.json generation
      # =========================
      - name: Generate latest.json (darwin-aarch64)
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"

          DMG_FILE="$(basename "$(ls -1 src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)")"
          SIG_FILE="$(basename "$(ls -1 src-tauri/target/release/bundle/dmg/*.sig | head -n 1)")"

          SIG_CONTENT="$(cat "src-tauri/target/release/bundle/dmg/${SIG_FILE}")"

          DMG_PATH="src-tauri/target/release/bundle/dmg/${DMG_FILE}"

          # macOS stat
          SIZE="$(stat -f%z "${DMG_PATH}")"

          # ISO date
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG_FILE}",
                "signature": ${SIG_CONTENT@Q},
                "size": ${SIZE}
              }
            }
          }
          EOF

          echo "✅ latest.json created"
          cat latest.json

      - name: Commit release files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # IMPORTANT: ensure we don't commit embedded repo
          rm -rf _b2uprog || true

          git add -A
          git commit -m "chore: release v${{ steps.ver.outputs.version }}" || true

      - name: Tag + Push
        shell: bash
        run: |
          set -e
          TAG="v${{ steps.ver.outputs.version }}"
          git tag -f "$TAG"

          # ✅ avoid non-fast-forward issues by rebasing
          git fetch origin main
          git rebase origin/main || true

          git push origin main
          git push -f origin "$TAG"

      - name: Upload Release (GH Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
