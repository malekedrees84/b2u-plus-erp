[package]
name = "app"
version = "0.1.0"
description = "B2U Plus ERP"
authors = ["malekedrees"]
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/malekedrees84/b2u-plus-erp"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

tauri-plugin-updater = "2"
tauri-plugin-dialog  = "2"
