name: Auto Release (Tauri) + Sync from b2uprog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout b2u-plus-erp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout b2uprog (source UI)
        uses: actions/checkout@v4
        with:
          repository: malekedrees84/b2uprog
          ref: main
          path: _b2uprog
          token: ${{ secrets.B2UPROG_TOKEN }}

      # ✅ Sync UI (بدون .git)
      - name: Sync UI from b2uprog into b2u-plus-erp
        shell: bash
        run: |
          set -e

          rm -rf ./components ./services ./backend ./icons ./dist ./node_modules || true
          rm -f ./App.tsx ./index.tsx ./index.html ./vite.config.ts ./tsconfig.json ./constants.ts ./types.ts ./package.json ./package-lock.json ./README.md ./metadata.json || true

          rsync -a --delete --exclude ".git" _b2uprog/components/ components/ || true
          rsync -a --delete --exclude ".git" _b2uprog/services/ services/ || true
          rsync -a --delete --exclude ".git" _b2uprog/backend/ backend/ || true
          rsync -a --delete --exclude ".git" _b2uprog/icons/ icons/ || true
          rsync -a --delete --exclude ".git" _b2uprog/dist/ dist/ || true

          cp -f _b2uprog/App.tsx App.tsx || true
          cp -f _b2uprog/index.tsx index.tsx || true
          cp -f _b2uprog/index.html index.html || true
          cp -f _b2uprog/vite.config.ts vite.config.ts || true
          cp -f _b2uprog/tsconfig.json tsconfig.json || true
          cp -f _b2uprog/constants.ts constants.ts || true
          cp -f _b2uprog/types.ts types.ts || true
          cp -f _b2uprog/package.json package.json || true
          cp -f _b2uprog/package-lock.json package-lock.json || true
          cp -f _b2uprog/README.md README.md || true
          cp -f _b2uprog/metadata.json metadata.json || true

          echo "✅ Sync done"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (ci if lock exists)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm i -D @tauri-apps/cli

      # ✅ كتابة المفتاح من Base64 (حل جذري لمسافات/أسطر/رموز)
      - name: Write signing key file from Base64 Secret
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.tauri"
          echo "${TAURI_SIGNING_PRIVATE_KEY_B64}" | base64 --decode > "$HOME/.tauri/b2u-plus-erp.key"
          chmod 600 "$HOME/.tauri/b2u-plus-erp.key"
          echo "✅ Key file written"
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}

      - name: Build Tauri (release)
        run: npx tauri build

      - name: Sign DMG
        shell: bash
        run: |
          set -e
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)"
          echo "Signing $DMG"
          npx tauri signer sign "$DMG" \
            --private-key-path "$HOME/.tauri/b2u-plus-erp.key" \
            --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Release (GH Release)
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
